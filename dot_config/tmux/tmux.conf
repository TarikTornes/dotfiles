####################################################################
#
# This is Tariks Tmux Config file
# - keybindings
# - Vim behaviour
# - Color settings
#
####################################################################

#-------------------------------------------------------------------
# KEY BINDINGS
#-------------------------------------------------------------------

# Set Prefix Key to Ctrl-Space
unbind-key C-b
set -g prefix C-Space
bind C-Space send-prefix


# Split window
unbind '"'
unbind -
unbind =
bind = split-window -h -c "#{pane_current_path}"      # split window vertically
bind - split-window -c "#{pane_current_path}"      # split window horizontally


# keybinding for copy mode
bind C-c copy-mode
# keybinding for pasting buffe
unbind ]
bind C-v paste-buffer


unbind C-s
# Displays first the pane numbers and then asks which panes to swap
bind -n C-s display-panes \; command-prompt -1 -p "Pane A: ","Pane B: " "swap-pane -s '%1' -t '%2'"


bind m switch-client -T MODPANES \; display-message 'MODPANES mode (h/j/k/l, q = quit)'
bind -T MODPANES h resize-pane -L 4 \; switch-client -T MODPANES
bind -T MODPANES j resize-pane -D 4 \; switch-client -T MODPANES
bind -T MODPANES k resize-pane -U 4 \; switch-client -T MODPANES
bind -T MODPANES l resize-pane -R 4 \; switch-client -T MODPANES

bind -T MODPANES H swap-pane -d -t '{left-of}'  \; switch-client -T MODPANES
bind -T MODPANES L swap-pane -d -t '{right-of}'  \; switch-client -T MODPANES
bind -T MODPANES J swap-pane -d -t '{down-of}'  \; switch-client -T MODPANES
bind -T MODPANES K swap-pane -d -t '{up-of}'  \; switch-client -T MODPANES


# keybindings to selet panes
# unbind Up
# unbind Down
# unbind Left
# unbind Right
# bind -n C-h select-pane -L
# bind -n C-j select-pane -D
# bind -n C-k select-pane -U
# bind -n C-l select-pane -R

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


#-------------------------------------------------------------------
# VIM BINDINGS IN COPY-MODE
#-------------------------------------------------------------------

setw -g mode-keys vi



#-------------------------------------------------------------------
# COLOR SETTINGS
#-------------------------------------------------------------------

# color-setting of statusbar
set -g status-bg "#ff913d"
set -g status-fg "#1a0c00"

# color-setting of border between panes
set -g pane-border-style fg="#ff913d"
set -g pane-active-border-style fg="colour172"



set-option -ga terminal-overrides ',alacritty:Tc'
set-option -sg escape-time 10
set-option -g focus-events on
