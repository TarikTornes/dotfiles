# ~/.aerospace.toml

after-login-command = []
after-startup-command = []

start-at-login = true

# Normalization keeps the tree clean
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 50

default-root-container-layout = 'tiles'

# 'auto': wide monitor = horizontal, tall monitor = vertical
default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

# Mouse follows focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = 'move-mouse window-lazy-center'

[gaps]
inner.horizontal = 5
inner.vertical   = 5
outer.left       = 5
outer.bottom     = 5
outer.top        = 5
outer.right      = 5

[mode.main.binding]

# --- Apps ---
alt-t       = 'exec-and-forget open -n /Applications/Alacritty.app/'
alt-enter   = 'exec-and-forget open -n /Applications/Brave\ Browser.app/'

# --- Layout toggles ---
# Toggle tiles horizontal/vertical (whole workspace)
alt-comma   = 'layout tiles horizontal vertical'
alt-period  = 'layout accordion horizontal vertical'

# Force split direction for current container (useful before opening a new window)
# ctrl-alt-h = horizontal split, ctrl-alt-v = vertical split
ctrl-alt-h  = 'layout h_tiles'
ctrl-alt-v  = 'layout v_tiles'

# --- Utilities ---
alt-b = 'balance-sizes'
alt-f = 'fullscreen'

# --- Focus (ctrl-alt to avoid conflicts with Finder and other apps) ---
ctrl-alt-left  = 'focus left'
ctrl-alt-down  = 'focus down'
ctrl-alt-up    = 'focus up'
ctrl-alt-right = 'focus right'

# --- Move windows ---
ctrl-alt-shift-left  = 'move left'
ctrl-alt-shift-down  = 'move down'
ctrl-alt-shift-up    = 'move up'
ctrl-alt-shift-right = 'move right'

# --- Resize ---
alt-shift-down = 'resize smart -50'
alt-shift-up   = 'resize smart +50'

# --- Workspaces ---
cmd-1 = 'workspace T'
cmd-2 = 'workspace B'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace Floats'

# --- Move window to workspace ---
cmd-shift-1 = 'move-node-to-workspace T'
cmd-shift-2 = 'move-node-to-workspace B'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace Floats'

# --- Workspace navigation ---
alt-tab       = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# --- Service mode ---
alt-s = 'mode service'

[mode.service.binding]
r   = ['reload-config', 'mode main']
f   = ['flatten-workspace-tree', 'mode main']   # reset layout
esc = ['layout floating tiling', 'mode main']   # toggle float/tile
backspace = ['close-all-windows-but-current', 'mode main']

# Join windows into sub-containers (to manually build nested layouts)
alt-shift-h = ['join-with left',  'mode main']
alt-shift-j = ['join-with down',  'mode main']
alt-shift-k = ['join-with up',    'mode main']
alt-shift-l = ['join-with right', 'mode main']

# --- Window rules ---

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating', 'move-node-to-workspace Floats']

[[on-window-detected]]
if.app-id = 'com.apple.FaceTime'
run = ['layout floating', 'move-node-to-workspace Floats']

[[on-window-detected]]
if.app-id = 'org.alacritty'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = 'move-node-to-workspace B'
